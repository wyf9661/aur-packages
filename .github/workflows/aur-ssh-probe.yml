name: aur-ssh-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          AUR_SSH_KEY_B64: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          echo "$AUR_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Loop probe (12x ls-remote, no pipe, real exit)
        run: |
          for i in $(seq 1 12); do
            out=$(timeout 20 git ls-remote ssh://aur@aur.archlinux.org/arch-update.git HEAD 2>&1)
            ec=$?
            msg=$(echo "$out" | head -1 | cut -c1-70)
            echo "probe $i: exit=$ec | $msg"
            sleep 20
          done
